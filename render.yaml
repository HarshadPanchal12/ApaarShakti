services:
  # ==============================================================================
  # 1. FastAPI Backend ASGI Service
  # ==============================================================================
  - type: web
    name: apaar-verify-api
    runtime: python
    region: oregon
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        value: https://bqotejnuhhytkwroajtz.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SIGNING_KEY
        sync: false
      - key: FIELD_KEY
        sync: false
      - key: WEB_ORIGIN
        value: "*"
      - key: SUPERNUMERARY_PCT
        value: "0.05"

  # ==============================================================================
  # 2. Next.js 14 Frontend Web Service
  # ==============================================================================
  - type: web
    name: apaar-verify-web
    runtime: node
    region: oregon
    plan: free
    rootDir: web
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://bqotejnuhhytkwroajtz.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_h8mnHW0nNIGX1KhOyebBnw_9TfKEOtq
      - key: NEXT_PUBLIC_API_URL
        value: https://apaar-verify-api.onrender.com
